<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101626" />
    <title>BhashaBuddy</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(255, 167, 38, 0.28), transparent 35%),
          linear-gradient(180deg, #101626 0%, #070b12 100%);
        color: #f4f4f5;
        font: 500 16px/1.5 "Segoe UI", system-ui, sans-serif;
      }

      main {
        width: min(92vw, 560px);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: rgba(16, 22, 38, 0.88);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.9rem, 5vw, 2.8rem);
      }

      p {
        margin: 0;
        color: #d4d4d8;
      }

      a {
        color: #ffb347;
      }
    </style>
    <script>
      const target = new URL("./web/viewer.html", window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    </script>
  </head>
  <body>
    <main>
      <h1>Opening BhashaBuddy</h1>
      <p>
        If the PDF viewer does not open automatically, continue to
        <a href="./web/viewer.html">the viewer</a>.
      </p>
    </main>
  </body>
</html>
